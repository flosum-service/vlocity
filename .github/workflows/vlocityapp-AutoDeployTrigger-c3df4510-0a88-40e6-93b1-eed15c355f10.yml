name: Trigger auto deployment for vlocityapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ 1.2.3 ]
    paths:
    - '**'
    - '.github/workflows/vlocityapp-AutoDeployTrigger-c3df4510-0a88-40e6-93b1-eed15c355f10.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.VLOCITYAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.VLOCITYAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.VLOCITYAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.VLOCITYAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.VLOCITYAPP_REGISTRY_PASSWORD }}
          containerAppName: vlocityapp
          resourceGroup: flosumagentdemo
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


